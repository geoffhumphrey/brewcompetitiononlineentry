name: CI

on:
  push:
    branches: [master, modernization]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} — lint, phpstan, phpunit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bcoem_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Load baseline schema into MySQL
        run: |
          mysql -h 127.0.0.1 -uroot -proot bcoem_test < sql/bcoem_baseline_3.0.X.sql

      - name: PHP syntax check (all tracked files)
        run: |
          set -e
          while IFS= read -r file; do
            php -l "$file" > /dev/null
          done < <(git ls-files '*.php')

      - name: PHPStan (legacy, level 4)
        run: composer analyse

      - name: PHPStan (src, level 6 + strict rules)
        run: vendor/bin/phpstan analyse -c phpstan.src.neon --no-progress

      - name: PHPUnit
        run: composer test
